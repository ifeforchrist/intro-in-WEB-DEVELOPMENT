<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
     
    body{
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #1a1a1a;
      justify-content: center;
    }
    .anime {
        background: linear-gradient(
          to bottom,
          red,
          rgb(255, 83, 252),
          red,
          rgb(255, 83, 252)
        );
        width: 100%;
        height: 100px;
        background-size: 300px 300px;
        animation: anime 5s ease infinite;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    
    

    .anime h1 {
      font-size:200px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }
      
      .anime p {
      font-size: 18px;
      color: #555;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .input-box {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      margin: 0 auto;
    }
    .input-box input {
      border: none;
      background: transparent;
      font-size: 16px;
      width: 100%;
      color: #333;
    }

    
    .button {
      display: flex;
      gap: 10px;
    }
    .btn-build {
      background: transparent;
      border: none;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      padding: 10px;
    }

    .btn-now {
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-now:hover {
      background: #000;
    }

      @keyframes anime {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 0% 50%;
        }

        65%{
             background-position: 0% 50%;
        }

        75% {
          background-position: 0% 100%;
        }

        100% {
          background-position: 0% 0%;
        }
      }
    </style>
  </head>
  <body>
    <div class="anime">BRIK</div>

      <h1>Your ideas<br>deserve to move</h1>
    
      <p>Imagine it — Brik builds it. Yours to control, refine and export.</p>

        <div class="input-box">
          <input type="text" placeholder="Describe the visual in your head...">
          <div class="button">
             <button class="btn-build">Build ▾</button>
             <button class="btn-now">Build Now +</button>
          </div>
        </div>
    </div>
  </body>
</html>
